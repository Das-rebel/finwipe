name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        run: go build -buildvcs=false -o finwipe ./cmd/finwipe

      - name: Run tests
        run: go test ./...

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build binary
        run: |
          GOOS=darwin GOARCH=amd64 go build -o finwipe-darwin-amd64 ./cmd/finwipe
          GOOS=darwin GOARCH=arm64 go build -o finwipe-darwin-arm64 ./cmd/finwipe
          GOOS=linux GOARCH=amd64 go build -o finwipe-linux-amd64 ./cmd/finwipe
          GOOS=windows GOARCH=amd64 go build -o finwipe-windows-amd64.exe ./cmd/finwipe

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            finwipe-darwin-amd64
            finwipe-darwin-arm64
            finwipe-linux-amd64
            finwipe-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build Go binary
        run: go build -buildvcs=false -o finwipe ./cmd/finwipe

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
