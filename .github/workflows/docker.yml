name: Docker Build & Push

on:
  push:
    tags:
      - 'v*'          # trigger on tags like v0.2.0

permissions:
  contents: read
  packages: write    # needed to push to GHCR
  id-token: write    # for OIDC login (optional but nice)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GHCR using the default GITHUB_TOKEN (no secret needed)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build & push multi‑arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/das-rebel/finwipe-server:${{ steps.version.outputs.VERSION }}
            ghcr.io/das-rebel/finwipe-server:latest
          cache-from: type=registry,ref=ghcr.io/das-rebel/finwipe-server:cache
          cache-to: type=registry,ref=ghcr.io/das-rebel/finwipe-server:cache,mode=max
